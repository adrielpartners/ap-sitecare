services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sitecare_test
      POSTGRES_PASSWORD: sitecare
      POSTGRES_USER: sitecare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitecare -d sitecare_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
