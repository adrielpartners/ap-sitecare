name: sitecare

services:
  sitecare-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitecare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-sitecare}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitecare} -d ${POSTGRES_DB:-sitecare}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - sitecare_internal
    volumes:
      - sitecare-postgres-data:/var/lib/postgresql/data

  sitecare-dashboard:
    build:
      context: /opt/sitecare
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sitecare-postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      HOST: 0.0.0.0
      NUXT_BACKUPS_ALLOWED_LOCAL_BASE_DIRECTORIES: /backup-sources
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?NUXT_DATABASE_URL is required}
      PORT: 3000
    networks:
      - traefik_proxy
      - sitecare_internal
    volumes:
      - /opt/sitecare/backup-sources:/backup-sources:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.sitecare-dashboard.rule=Host(`sitecare.adrielpartners.com`)"
      - "traefik.http.routers.sitecare-dashboard.entrypoints=websecure"
      - "traefik.http.routers.sitecare-dashboard.tls.certresolver=mytlschallenge"
      - "traefik.http.services.sitecare-dashboard.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup-worker:
    build:
      context: /opt/sitecare
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      sitecare-postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      NUXT_BACKUPS_ALLOWED_LOCAL_BASE_DIRECTORIES: /backup-sources
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?NUXT_DATABASE_URL is required}
    networks:
      - sitecare_internal
    volumes:
      - /opt/sitecare/backup-sources:/backup-sources:ro

  email-worker:
    build:
      context: /opt/sitecare
      dockerfile: Dockerfile
      target: worker
    command: ["npm", "run", "email-worker:continuous", "--workspace=@ap-sitecare/dashboard"]
    restart: unless-stopped
    depends_on:
      sitecare-postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?NUXT_DATABASE_URL is required}
    networks:
      - sitecare_internal

  automation-worker:
    build:
      context: /opt/sitecare
      dockerfile: Dockerfile
      target: worker
    command: ["npm", "run", "automation-worker:continuous", "--workspace=@ap-sitecare/dashboard"]
    restart: unless-stopped
    depends_on:
      sitecare-postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?NUXT_DATABASE_URL is required}
    networks:
      - sitecare_internal

volumes:
  sitecare-postgres-data:

networks:
  sitecare_internal:
    internal: true
  traefik_proxy:
    external: true
